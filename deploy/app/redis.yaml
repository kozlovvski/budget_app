# BullMQ's Redis. No volume: it holds only queued job IDs, and every consumer's sweep finds lost work again
# (architecture §3, §9). Any pod in the cluster can reach it (flannel ignores NetworkPolicies), hence the password.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          # BullMQ requires noeviction; maxmemory stays below the limit so Redis refuses writes before the OOM kill.
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ''
            - --appendonly
            - 'no'
            - --maxmemory
            - 96mb
            - --maxmemory-policy
            - noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: budget-redis, key: password }
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: { port: 6379 }
          livenessProbe:
            tcpSocket: { port: 6379 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999 # the image's redis user
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports:
    - port: 6379
